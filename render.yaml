services:
  - type: web
    name: pokeprice-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/summary
    envVars:
      - key: RENDER
        value: "true"
      - key: POKEPRICE_DB
        value: pokeprice.db
      - key: POKEPRICE_DELAY
        value: "1.0"
      - key: MKM_APP_TOKEN
        sync: false
      - key: MKM_APP_SECRET
        sync: false
      - key: MKM_ACCESS_TOKEN
        sync: false
      - key: MKM_ACCESS_SECRET
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_MARKETPLACE_ID
        value: EBAY_DE
