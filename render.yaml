services:
  # ── Web-Dashboard ────────────────────────────────────────────────────────────
    - type: web
        name: pokeprice-dashboard
            runtime: python
                plan: free
                    buildCommand: pip install -r requirements.txt
                        startCommand: bash start.sh
                            healthCheckPath: /api/summary

                                # Persistent Disk: SQLite-Datei ueberlebt Deployments
                                    # Erfordert mindestens den "Starter"-Plan (kostenpflichtig)
                                        # disk:
                                            #   name: pokeprice-data
                                                #   mountPath: /var/data
                                                    #   sizeGB: 1

                                                        envVars:
                                                              - key: RENDER
                                                                      value: "true"
                                                                            - key: POKEPRICE_DB
                                                                                    # Free-Plan: DB liegt im Container (geht bei Redeploy verloren).
                                                                                            # Starter-Plan: /var/data/pokeprice.db
                                                                                                    value: pokeprice.db
                                                                                                          - key: POKEPRICE_DELAY
                                                                                                                  value: "1.0"
                                                                                                                  
                                                                                                                        # Cardmarket — in Render Dashboard als Secret hinterlegen
                                                                                                                              - key: MKM_APP_TOKEN
                                                                                                                                      sync: false
                                                                                                                                            - key: MKM_APP_SECRET
                                                                                                                                                    sync: false
                                                                                                                                                          - key: MKM_ACCESS_TOKEN
                                                                                                                                                                  sync: false
                                                                                                                                                                        - key: MKM_ACCESS_SECRET
                                                                                                                                                                                sync: false
                                                                                                                                                                                
